name: API release
# Production deploys already happen from main in test.yml. A version tag only
# re-runs the checks and records the exact bundle on the GitHub release page.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Package worker bundle
        run: |
          set -euo pipefail
          mkdir -p out
          tar -czf "out/otpanda-api-${GITHUB_REF_NAME}.tar.gz" dist
          (cd out && sha256sum * > SHA256SUMS.txt)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes --title "OTPanda API ${GITHUB_REF_NAME}")
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" out/*
