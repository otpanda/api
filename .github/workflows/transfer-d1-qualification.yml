name: 'Remote D1 qualification, transfer, seed-sync or legacy upgrade'
# Manual only. Creates a temporary synthetic D1 database and a throwaway Worker, runs the actual batch-import
# SQL against remote D1, then deletes both even on failure. Touches no production database or Worker.
on:
  workflow_dispatch:
    inputs:
      suite: {description: 'Which qualification suite to run', type: choice, options: [transfer, seed-sync, seed-sync-upgrade], default: transfer, required: true}
      observed_at: {description: 'Dashboard observation time, ISO UTC ending in Z, at most 30 minutes old', required: true}
      observed_plan: {description: 'Exactly workers-free, as read from the authenticated dashboard', required: true}
      account_id: {description: 'Cloudflare account id the observation was read from', required: true}
      commit: {description: 'Exact commit SHA this run must be for', required: true}
      daily_rows_written: {description: 'D1 rows written today (UTC), as observed', required: true}
      daily_rows_read: {description: 'D1 rows read today (UTC), as observed', required: true}
      database_count: {description: 'D1 databases in the account, as observed', required: true}
permissions:
  contents: read
concurrency:
  group: otpanda-d1-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a04834f19f0dfd5dc4eb47515d15478d
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Live Free-plan gate (fail closed, before any resource exists)
        env:
          GATE_OBSERVED_AT: ${{ inputs.observed_at }}
          GATE_PLAN: ${{ inputs.observed_plan }}
          GATE_ACCOUNT_ID: ${{ inputs.account_id }}
          GATE_COMMIT: ${{ inputs.commit }}
          GATE_DAILY_WRITES: ${{ inputs.daily_rows_written }}
          GATE_DAILY_READS: ${{ inputs.daily_rows_read }}
          GATE_DB_COUNT: ${{ inputs.database_count }}
        run: node qualification/plan-gate.mjs
      - name: Create isolated resources, run checks and delete
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          case "$SUITE" in transfer|seed-sync|seed-sync-upgrade) ;; *) echo 'unknown suite'; exit 1;; esac
          dir="qualification/$SUITE"
          config="$dir/wrangler.json"
          name="otpanda-${SUITE}-qual-${GITHUB_RUN_ID}"
          dbid=''
          cleanup_failed=0
          deployed=0
          cleanup() {
            result=$?
            set +e
            if [ "$deployed" = 1 ]; then
              node $dir/delete-worker.mjs || cleanup_failed=1
            fi
            if [ -n "$dbid" ]; then
              node $dir/delete-database.mjs "$dbid" || cleanup_failed=1
            fi
            if [ "$cleanup_failed" != 0 ]; then exit 1; fi
            exit "$result"
          }
          trap cleanup EXIT
          npx wrangler d1 create "$name" --config "$config" > $dir/database-create.txt
          dbid=$(node -e 'const fs=require("fs");const x=fs.readFileSync(process.argv[1]+"/database-create.txt","utf8");const m=x.match(/"database_id"\s*:\s*"([0-9a-f-]{36})"/);if(m)process.stdout.write(m[1])' "$dir")
          test -n "$dbid"
          node - "$dbid" "$name" "$dir" <<'JS'
          const fs=require('fs'),crypto=require('crypto');
          const p=process.argv[4]+'/wrangler.json',x=JSON.parse(fs.readFileSync(p));
          x.name=process.argv[3];
          x.vars.FIXTURE_PREFIX='qualification-'+crypto.randomBytes(12).toString('hex');
          if(process.argv[4].endsWith('seed-sync-upgrade'))x.vars.FIXTURE_KEY_B64=crypto.randomBytes(32).toString('base64');
          x.d1_databases[0].database_id=process.argv[2];
          x.d1_databases[0].database_name=process.argv[3];
          fs.writeFileSync(p,JSON.stringify(x,null,2));
          JS
          if [ "$SUITE" = seed-sync-upgrade ]; then
            rm -rf "$dir/pre-migrations"; mkdir "$dir/pre-migrations"
            for f in migrations/*.sql; do if [[ "$(basename "$f")" < 0052 ]]; then cp "$f" "$dir/pre-migrations/"; fi; done
          fi
          npx wrangler d1 migrations apply "$name" --remote --config "$config"
          # Set before deploy so an interrupted upload is still cleaned up.
          deployed=1
          npx wrangler deploy --config "$config"
          sleep 10
          prefix=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1]+"/wrangler.json")).vars.FIXTURE_PREFIX)' "$dir")
          base="https://$name.abrahammurciano.workers.dev/$prefix"
          if [ "$SUITE" = seed-sync-upgrade ]; then
            node $dir/driver.mjs "$base" seed-legacy
            cp migrations/*.sql "$dir/pre-migrations/"
            npx wrangler d1 migrations apply "$name" --remote --config "$config"
            node $dir/driver.mjs "$base" verify
          else
            node $dir/driver.mjs "$base"
          fi
      - name: Preserve synthetic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.suite }}-qualification-results
          path: qualification/${{ inputs.suite }}/${{ inputs.suite }}-result.json
          retention-days: 2
