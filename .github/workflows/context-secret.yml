name: Provision initial context digest secret once
on:
  workflow_dispatch:
    inputs:
      confirmation:
        required: true
        type: choice
        options: [do-not-provision, initial-context-secret-once]
      expected_sha:
        required: true
        description: Exact reviewed main commit
permissions:
  contents: read
concurrency:
  group: otpanda-production
  cancel-in-progress: false
jobs:
  provision:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'initial-context-secret-once' && inputs.expected_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node --test test/provision-context-secret.test.js
      - name: Reserve and provision in provider custody, no automatic retry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTEXT_CONFIRM: ${{ inputs.confirmation }}
          CONTEXT_EXPECTED_SHA: ${{ inputs.expected_sha }}
          NODE_OPTIONS: ''
          NODE_DEBUG: ''
        run: node scripts/provision-context-secret.mjs
