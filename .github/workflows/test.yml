name: API checks
on:
  push:
    branches: [main, qualification/sharing-v11-trigger0067-ci, qualification/import-v2-0066-ci]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: api-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit
      - name: Lint
        run: |
          npm install --no-save --no-package-lock --ignore-scripts eslint@9.39.5 @eslint/js@9.39.5 globals@17.14.0
          npx eslint .
      - run: npm run build
      - run: npm run db:local
      - run: npm run db:local
