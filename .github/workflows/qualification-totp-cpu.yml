name: One isolated synthetic TOTP CPU qualification
on:
  push:
    branches: [qualify/totp-cpu-once]
permissions:
  contents: read
concurrency:
  group: otpanda-totp-cpu-once
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: a04834f19f0dfd5dc4eb47515d15478d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
      QUALIFICATION_NAME: otpanda-totp-cpu-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Prepare synthetic-only Worker
        run: |
          mkdir -p /tmp/totp-cpu
          base64 -d > /tmp/totp-cpu/source.tgz <<'PAYLOAD'
          
          PAYLOAD
          tar -xzf /tmp/totp-cpu/source.tgz -C /tmp/totp-cpu
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          writeFileSync('/tmp/totp-cpu/wrangler.json',JSON.stringify({name:process.env.QUALIFICATION_NAME,main:'worker.mjs',compatibility_date:'2026-11-01',workers_dev:true,observability:{enabled:true}}));
          JS
      - name: Deploy isolated fixture without bindings or production changes
        run: npx wrangler deploy --config /tmp/totp-cpu/wrangler.json
      - name: One bounded 36-request synthetic batch
        run: |
          mkdir -p qualification-evidence
          node --input-type=module <<'JS' | tee qualification-evidence/check.log
          const base='https://'+process.env.QUALIFICATION_NAME+'.abrahammurciano.workers.dev';
          console.log('qualification_url='+base);
          for(const entries of [1,5,10,20])for(const algorithm of ['SHA-1','SHA-256','SHA-512'])for(let i=0;i<3;i++){
            const r=await fetch(base+'/?entries='+entries+'&algorithm='+algorithm,{signal:AbortSignal.timeout(15000)});
            console.log(JSON.stringify({entries,algorithm,request:i+1,status:r.status,body:await r.text()}));
          }
          JS
      - name: Bounded metrics inspection window
        run: sleep 360
      - name: Always delete isolated Worker and verify absence
        if: always()
        run: |
          mkdir -p qualification-evidence
          node --input-type=module <<'JS' | tee qualification-evidence/cleanup.log
          const name=process.env.QUALIFICATION_NAME;
          if(!/^otpanda-totp-cpu-\d+$/.test(name))throw Error('name safety');
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/'+name;
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const d=await fetch(url,{method:'DELETE',headers});console.log('delete_status='+d.status);
          const r=await fetch(url,{headers});console.log('verify_absent_status='+r.status);
          if((!d.ok&&d.status!==404)||r.status!==404)throw Error('cleanup not confirmed');
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetic-totp-cpu-${{ github.run_id }}
          path: qualification-evidence
          retention-days: 3
